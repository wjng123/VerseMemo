<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>VerseMemo – Genesis</title>
<style>
  body {font-family:Arial,Helvetica,sans-serif; margin:0; display:flex; flex-direction:column; height:100vh;}
  /* header removed */
  header select {margin-left:1rem; padding:0.2rem;}
  #verseList {flex:1; overflow:auto; padding:1rem; margin-left:190px;}
  #sideMenu {
    position:fixed;
    left:0;
    top:2rem;
    bottom:0;
    overflow:auto;
    width:180px;
    background:rgba(255,255,255,0.2);
    padding:1rem;
    box-sizing:border-box;
  }
  #logo {
    position:fixed;
    top:0;
    left:0;
    padding:0.5rem 1rem;
    font-weight:bold;
    font-size:1.2rem;
    background:transparent;
    z-index:1000;
  }
  .menuItem {margin-bottom:1rem;}
  .menuNotes {list-style:none; margin:0.45rem 0 0; padding:0;}
  .menuNotes li {background:#f4f6f8; border-radius:0.3rem; margin-top:0.35rem; padding:0.45rem; white-space:pre-wrap; overflow-wrap:anywhere;}
  .addBtn {
    font-size:1.1rem;
    font-weight:500;
    background:transparent;
    border:none;
    color:#000;
    cursor:pointer;
    padding:0;
    line-height:1;
  }

  #categoryDialog {
    box-sizing:border-box;
    width:min(calc(100vw - 2rem), max(50vw, 22rem));
    height:min(calc(100dvh - 2rem), max(50dvh, 16rem));
    padding:1rem;
    border:1px solid #ddd;
    border-radius:0.5rem;
  }
  #categoryDialog::backdrop {background:rgba(0,0,0,0.35);}
  #categoryForm {display:flex; flex-direction:column; height:100%;}
  #categoryTitle {margin:0 0 0.75rem;}
  #categoryForm textarea {flex:1; min-height:0; width:100%; box-sizing:border-box; resize:none; font:inherit;}
  .dialogActions {display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.75rem;}
  .savedNotes div, .categoryNotes div {white-space:pre-wrap; overflow-wrap:anywhere;}
  .verse {position:relative; margin-bottom:0.8rem; line-height:1.4;}
  .noteBtn {position:absolute; right:0; top:0; cursor:pointer; color:#4A90E2;}
  .noteBox {display:none; margin-top:0.4rem; border:1px solid #ddd; padding:0.4rem;}
  .noteBox textarea {width:100%; height:3rem;}
  .noteBox button {margin-top:0.2rem; padding:0.2rem 0.6rem;}
</style>
</head>
<body>
<div id="logo">VerseMemo</div>
<nav id="sideMenu">
  <div class="menuItem"><span>QT</span> <button class="addBtn" type="button" data-category="QT" aria-label="QT 메모 추가" aria-controls="categoryDialog">+</button><ul class="menuNotes" id="qtNotes"></ul></div>
  <div class="menuItem"><span>설교메모</span> <button class="addBtn" type="button" data-category="설교메모" aria-label="설교메모 추가" aria-controls="categoryDialog">+</button><ul class="menuNotes" id="sermonNotes"></ul></div>
</nav>
<div id="verseList"></div>

<dialog id="categoryDialog" aria-labelledby="categoryTitle">
  <form id="categoryForm">
    <h2 id="categoryTitle"></h2>
    <textarea id="categoryText" aria-label="메모 내용" required autofocus></textarea>
    <div class="dialogActions">
      <button type="button" id="cancelCategoryNote">취소</button>
      <button type="submit">저장</button>
    </div>
  </form>
</dialog>


<script>
let bible=null;
initMenuNotes();
fetch('genesis.json')
  .then(r=>r.json())
  .then(data=>{bible=data; renderChapter();})
  .catch(()=>alert('genesis.json 를 찾을 수 없습니다.'));
function initMenuNotes(){
  const dialog = document.getElementById('categoryDialog');
  const form = document.getElementById('categoryForm');
  const memo = document.getElementById('categoryText');
  let activeMenu;

  document.querySelectorAll('.addBtn').forEach(button => {
    const category = button.dataset.category;
    const key = 'menu-notes-' + category;
    const list = button.parentElement.querySelector('.menuNotes');
    const notes = JSON.parse(localStorage.getItem(key) || '[]');
    const addToList = text => {
      const item = document.createElement('li');
      item.textContent = text;
      list.append(item);
    };
    notes.forEach(addToList);

    button.addEventListener('click', () => {
      activeMenu = {key, notes, addToList};
      document.getElementById('categoryTitle').textContent = button.getAttribute('aria-label');
      form.reset();
      memo.setCustomValidity('');
      dialog.showModal();
    });
  });

  memo.addEventListener('input', () => memo.setCustomValidity(''));
  document.getElementById('cancelCategoryNote').addEventListener('click', () => dialog.close());
  form.addEventListener('submit', event => {
    event.preventDefault();
    const text = memo.value.trim();
    if (!text) {
      memo.setCustomValidity('메모 내용을 입력하세요.');
      memo.reportValidity();
      return;
    }
    const {key, notes, addToList} = activeMenu;
    localStorage.setItem(key, JSON.stringify([...notes, text]));
    notes.push(text);
    addToList(text);
    dialog.close();
  });
}
function renderChapter(){

  const verses = bible.chapters[0];
  const list=document.getElementById('verseList');
  list.innerHTML='';
  verses.forEach((txt,i)=>{
    const div=document.createElement('div');
    div.className='verse';
    const verseNo=`${i+1}`; // only verse number
    div.innerHTML=`<span>${verseNo} ${txt}</span>
                 <span class="noteBtn" onclick="toggleNote(this,'${verseNo}')">✏️</span>
                 <div class="noteBox" id="note-${verseNo.replace(':','-')}">
                   <div class="savedNotes"></div>
                   <textarea placeholder="새 메모 입력"></textarea>
                   <button onclick="saveNote('${verseNo}')">저장</button>
                 </div>
                 <div class="categoryNotes" id="cat-${verseNo}"></div>`;
    list.appendChild(div);
    renderSaved(verseNo);
    renderCategoryNotes(verseNo);
  });
}
function toggleNote(btn,verse){
  const box=btn.nextElementSibling;box.style.display=box.style.display==='block'?'none':'block';
}
function saveNote(verse){
  const box=document.getElementById('note-'+verse.replace(':','-'));
  const txt=box.querySelector('textarea').value.trim();
  if(!txt) return;
  const key=`note-${verse}`;
  const existing=JSON.parse(localStorage.getItem(key)||'[]');
  const now=new Date().toLocaleString();
  existing.push({time:now,text:txt});
  localStorage.setItem(key,JSON.stringify(existing));
  box.querySelector('textarea').value='';
  renderSaved(verse);
}
function renderSaved(verse){
  const key=`note-${verse}`;
  const notes=JSON.parse(localStorage.getItem(key)||'[]');
  const div=document.getElementById('note-'+verse.replace(':','-')).querySelector('.savedNotes');
  div.replaceChildren(...notes.map(createNoteRow));
}
function createNoteRow(note) {
  const row = document.createElement('div');
  const time = document.createElement('small');
  time.textContent = note.time;
  row.append(time, ' ' + note.text);
  return row;
}
function renderCategoryNotes(verse) {
  const container = document.getElementById('cat-' + verse);
  if (!container) return;
  const categories = ['QT', '설교메모'];
  container.replaceChildren();
  categories.forEach(category => {
    const notes = JSON.parse(localStorage.getItem(`note-${verse}-${category}`) || '[]');
    if (notes.length === 0) return;
    const section = document.createElement('div');
    section.className = 'cat-' + category;
    const title = document.createElement('strong');
    title.textContent = category + ':';
    section.append(title, ...notes.map(createNoteRow));
    container.append(section);
  });
}
</script>
</body>
</html>
